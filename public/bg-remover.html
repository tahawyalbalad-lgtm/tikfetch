<script type="text/babel" data-presets="react">
const { useState, useRef, useCallback } = React;

function makeIcon(paths) {
  return function Icon({ size = 24, className = "", strokeWidth = 2 }) {
    return (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
        {paths}
      </svg>
    );
  };
}

const UploadCloud = makeIcon(<><path d="M4 14.9A5 5 0 0 1 6 5.3 6 6 0 0 1 17.7 8.1 4.5 4.5 0 0 1 17 17H7a3 3 0 0 1-3-2.1Z" /><path d="M12 12v6" /><path d="m9.5 14.5 2.5-2.5 2.5 2.5" /></>);
const Download = makeIcon(<><path d="M12 3v12" /><path d="m7 10 5 5 5-5" /><path d="M5 21h14" /></>);
const Copy = makeIcon(<><rect x="9" y="9" width="13" height="13" rx="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></>);
const Share2 = makeIcon(<><circle cx="18" cy="5" r="3" /><circle cx="6" cy="12" r="3" /><circle cx="18" cy="19" r="3" /><line x1="8.59" y1="13.51" x2="15.42" y2="17.49" /><line x1="15.41" y1="6.51" x2="8.59" y2="10.49" /></>);
const X = makeIcon(<><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></>);
const ShieldCheck = makeIcon(<><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" /><path d="m9 12 2 2 4-4" /></>);
const Zap = makeIcon(<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />);
const Image2 = makeIcon(<><rect x="3" y="3" width="18" height="18" rx="2" /><circle cx="9" cy="9" r="2" /><path d="m21 15-5-5L5 21" /></>);
const AlertTriangle = makeIcon(<><path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" /><path d="M12 9v4" /><path d="M12 17h.01" /></>);
const ArrowLeft = makeIcon(<><line x1="19" y1="12" x2="5" y2="12" /><polyline points="12 19 5 12 12 5" /></>);

// Downscale very large images client-side before handing them to the model —
// keeps first-run processing fast without a visible quality hit.
function loadAndResize(file, maxSide = 1600) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if (Math.max(width, height) > maxSide) {
        const scale = maxSide / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob) => {
        URL.revokeObjectURL(url);
        resolve({ blob, previewUrl: canvas.toDataURL("image/png"), width, height });
      }, "image/png");
    };
    img.onerror = reject;
    img.src = url;
  });
}

function CompareSlider({ beforeSrc, afterSrc }) {
  const [pos, setPos] = useState(50);
  const containerRef = useRef(null);
  const dragging = useRef(false);

  const updateFromClientX = (clientX) => {
    const el = containerRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const pct = Math.min(100, Math.max(0, ((clientX - rect.left) / rect.width) * 100));
    setPos(pct);
  };

  const onPointerDown = (e) => { dragging.current = true; updateFromClientX(e.clientX); };
  const onPointerMove = (e) => { if (dragging.current) updateFromClientX(e.clientX); };
  const stop = () => { dragging.current = false; };

  return (
    <div
      ref={containerRef}
      onPointerDown={onPointerDown}
      onPointerMove={onPointerMove}
      onPointerUp={stop}
      onPointerLeave={stop}
      className="checkerboard relative mx-auto w-full max-w-md overflow-hidden rounded-2xl select-none touch-none"
      style={{ aspectRatio: "1 / 1" }}
    >
      <img src={afterSrc} alt="Photo with background removed — transparent PNG result" className="absolute inset-0 h-full w-full object-contain" draggable="false" />
      <div className="absolute inset-0" style={{ clipPath: `inset(0 ${100 - pos}% 0 0)` }}>
        <img src={beforeSrc} alt="Original uploaded photo before background removal" className="absolute inset-0 h-full w-full object-contain" draggable="false" />
      </div>
      <div className="compare-handle" style={{ left: `${pos}%` }} />
      <span className="absolute left-2 top-2 rounded-full bg-black/50 px-2 py-0.5 text-[10px] font-medium text-white">Before</span>
      <span className="absolute right-2 top-2 rounded-full bg-black/50 px-2 py-0.5 text-[10px] font-medium text-white">After</span>
    </div>
  );
}

function BgRemoverApp() {
  const [view, setView] = useState("idle"); // idle | loading | result | error
  const [dragActive, setDragActive] = useState(false);
  const [beforeUrl, setBeforeUrl] = useState(null);
  const [resultUrl, setResultUrl] = useState(null);
  const [resultBlob, setResultBlob] = useState(null);
  const [progressLabel, setProgressLabel] = useState("");
  const [toast, setToast] = useState(null);
  const fileInputRef = useRef(null);

  const showToast = (msg) => {
    setToast(msg);
    window.clearTimeout(showToast._t);
    showToast._t = window.setTimeout(() => setToast(null), 2600);
  };

  const processFile = useCallback(async (file) => {
    if (!file || !file.type.startsWith("image/")) {
      showToast("Please choose an image file (JPG, PNG, or WEBP).");
      return;
    }
    if (file.size > 20 * 1024 * 1024) {
      showToast("That image is larger than 20MB — try a smaller file.");
      return;
    }

    setView("loading");
    setProgressLabel("Preparing your image…");

    try {
      const { blob: resizedBlob, previewUrl } = await loadAndResize(file);
      setBeforeUrl(previewUrl);

      setProgressLabel("Loading the AI model — first run only, please wait…");
      const { default: removeBackground } = await import("https://esm.sh/@imgly/background-removal@1.7.0");

      const outBlob = await removeBackground(resizedBlob, {
        progress: (key, current, total) => {
          if (total) setProgressLabel(`Downloading AI model… ${Math.round((current / total) * 100)}%`);
        },
      });

      const outUrl = URL.createObjectURL(outBlob);
      setResultBlob(outBlob);
      setResultUrl(outUrl);
      setView("result");
    } catch (err) {
      console.error("Background removal failed:", err);
      setView("error");
    }
  }, []);

  const onDrop = (e) => {
    e.preventDefault();
    setDragActive(false);
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    processFile(file);
  };

  const onFileChange = (e) => {
    const file = e.target.files && e.target.files[0];
    processFile(file);
  };

  const reset = () => {
    setView("idle");
    setBeforeUrl(null);
    setResultUrl(null);
    setResultBlob(null);
    if (fileInputRef.current) fileInputRef.current.value = "";
  };

  const handleDownload = () => {
    if (!resultUrl) return;
    const a = document.createElement("a");
    a.href = resultUrl;
    a.download = "tikfetch-transparent-background.png";
    document.body.appendChild(a);
    a.click();
    a.remove();
  };

  const handleCopy = async () => {
    if (!resultBlob) return;
    try {
      if (!window.ClipboardItem) throw new Error("unsupported");
      await navigator.clipboard.write([new window.ClipboardItem({ "image/png": resultBlob })]);
      showToast("Copied to clipboard.");
    } catch {
      showToast("Copy isn't supported in this browser — try downloading instead.");
    }
  };

  const handleShare = async () => {
    if (!resultBlob) return;
    try {
      const file = new File([resultBlob], "tikfetch-transparent-background.png", { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "Background removed with TikFetch" });
      } else {
        throw new Error("unsupported");
      }
    } catch {
      showToast("Sharing isn't supported here — try downloading instead.");
    }
  };

  return (
    <div className="min-h-screen w-full text-white antialiased">
      <div className="bg-noise arc-halo-wrap">
        <div className="arc-halo" aria-hidden="true" />
        <div className="arc-halo-inner" aria-hidden="true" />

        <header className="safe-top relative z-10 mx-auto flex max-w-md items-center justify-between px-4 pt-5 md:max-w-2xl md:px-8 lg:max-w-4xl">
          <a href="/" className="flex items-center gap-2">
            <div className="flex h-10 w-10 items-center justify-center rounded-full bg-gradient-to-br from-[#8b5cf6] to-[#a855f7] p-2 shadow-[inset_0_1px_0_rgba(255,255,255,0.35),0_0_18px_-2px_rgba(168,85,247,0.9)]">
              <img src="/logo-icon.png" alt="TikFetch" className="h-full w-full object-contain brightness-0 invert" />
            </div>
            <span className="font-display text-[15px] font-semibold tracking-tight text-white">TikFetch</span>
          </a>
          <a href="/" className="flex items-center gap-1.5 rounded-full border border-[#8b5cf6]/20 bg-[#1d1735]/60 px-3 py-1.5 text-xs text-[#c9bdf0] transition-colors hover:border-[#8b5cf6]/40 hover:text-white">
            <ArrowLeft size={13} />TikTok Downloader
          </a>
        </header>

        <main className="relative z-10 mx-auto max-w-md px-4 pb-16 pt-6 md:max-w-2xl md:px-8 lg:max-w-4xl">
          <div className="mx-auto max-w-md md:max-w-xl">
            <span className="inline-flex items-center gap-1.5 rounded-full border border-[#8b5cf6]/25 bg-[#1d1735]/60 px-3 py-1.5 text-[11px] font-medium tracking-wide text-[#c9bdf0] backdrop-blur-sm">
              <Zap size={12} className="text-[#a855f7]" />Free · Instant · Runs in your browser
            </span>

            <h1 className="font-display mt-4 text-[32px] font-semibold leading-[1.1] tracking-tight text-white md:text-[42px]">
              Free AI Background Remover
            </h1>
            <p className="mt-3 text-[15px] leading-relaxed text-[#a197c4] md:text-base">
              Upload any photo and this AI background eraser removes it in seconds — no signup, no watermark.
              Get a clean, high-quality transparent PNG, ready to download, copy, or share straight to social media.
            </p>

            <div className="mt-4 flex flex-wrap gap-2">
              <span className="inline-flex items-center gap-1.5 rounded-full border border-[#8b5cf6]/15 bg-[#1d1735]/50 px-3 py-1.5 text-[11px] font-medium text-[#c9bdf0]">
                <ShieldCheck size={12} className="text-[#a855f7]" />Images never leave your device
              </span>
            </div>

            {view === "idle" && (
              <div
                onClick={() => fileInputRef.current && fileInputRef.current.click()}
                onDragOver={(e) => { e.preventDefault(); setDragActive(true); }}
                onDragLeave={() => setDragActive(false)}
                onDrop={onDrop}
                className={`dropzone card-sheen mt-6 flex cursor-pointer flex-col items-center justify-center gap-3 rounded-3xl bg-[#1d1735]/60 px-6 py-14 text-center backdrop-blur-xl ${dragActive ? "drag-active" : ""}`}
              >
                <div className="flex h-14 w-14 items-center justify-center rounded-full bg-gradient-to-br from-[#8b5cf6] to-[#a855f7] shadow-[0_0_28px_-4px_rgba(168,85,247,0.75)]">
                  <UploadCloud size={24} />
                </div>
                <div>
                  <p className="text-sm font-medium text-white">Drag &amp; drop an image here</p>
                  <p className="mt-1 text-xs text-[#a197c4]">or tap to browse — JPG, PNG, or WEBP, up to 20MB</p>
                </div>
                <input ref={fileInputRef} type="file" accept="image/*" onChange={onFileChange} className="hidden" aria-label="Upload an image to remove its background" />
              </div>
            )}

            {view === "loading" && (
              <div className="card-sheen mt-6 flex flex-col items-center justify-center gap-4 rounded-3xl border border-[#8b5cf6]/15 bg-[#1d1735]/70 px-6 py-16 text-center backdrop-blur-xl">
                <div className="flex h-12 w-12 items-center justify-center rounded-full border-2 border-[#8b5cf6]/30 border-t-[#a855f7] spin" />
                <p className="text-sm font-medium text-white">{progressLabel || "Removing the background…"}</p>
                <p className="max-w-xs text-xs leading-relaxed text-[#a197c4]/80">
                  The AI model loads once and is cached for next time — the first image on a new device takes a little longer.
                </p>
              </div>
            )}

            {view === "result" && (
              <section className="card-sheen mt-6 overflow-hidden rounded-3xl border border-[#8b5cf6]/15 bg-[#1d1735]/70 p-4 backdrop-blur-xl">
                <p className="text-[11px] font-medium uppercase tracking-[0.14em] text-[#a855f7]">Drag the handle to compare</p>
                <div className="mt-3">
                  <CompareSlider beforeSrc={beforeUrl} afterSrc={resultUrl} />
                </div>

                <div className="mt-4 grid grid-cols-2 gap-2 sm:grid-cols-3">
                  <button type="button" onClick={handleDownload} className="btn-sheen flex items-center justify-center gap-2 rounded-full bg-gradient-to-r from-[#8b5cf6] to-[#a855f7] px-4 py-3 text-sm font-medium text-white transition-all active:scale-[0.97]">
                    <Download size={16} />Download PNG
                  </button>
                  <button type="button" onClick={handleCopy} className="card-sheen flex items-center justify-center gap-2 rounded-full border border-[#8b5cf6]/15 bg-[#271f45] px-4 py-3 text-sm font-medium text-[#c9bdf0] transition-colors hover:bg-[#33285c] hover:text-white">
                    <Copy size={16} />Copy image
                  </button>
                  <button type="button" onClick={handleShare} className="card-sheen col-span-2 flex items-center justify-center gap-2 rounded-full border border-[#8b5cf6]/15 bg-[#271f45] px-4 py-3 text-sm font-medium text-[#c9bdf0] transition-colors hover:bg-[#33285c] hover:text-white sm:col-span-1">
                    <Share2 size={16} />Share
                  </button>
                </div>

                <button type="button" onClick={reset} className="mt-3 flex w-full items-center justify-center gap-1.5 text-xs text-[#a197c4]/70 transition-colors hover:text-white">
                  <X size={12} />Start over with another image
                </button>
              </section>
            )}

            {view === "error" && (
              <div className="mt-6 flex items-start gap-3 rounded-3xl border border-red-400/20 bg-[#1d1735]/60 p-4 backdrop-blur-xl">
                <div className="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-red-500/15">
                  <AlertTriangle size={16} className="text-red-300" />
                </div>
                <div>
                  <p className="text-sm font-medium text-white">Couldn't process that image</p>
                  <p className="mt-1 text-xs leading-relaxed text-[#a197c4]">Try a different photo, or check your connection — the AI model needs to download once before the first use.</p>
                </div>
                <button type="button" onClick={reset} className="ml-auto shrink-0 rounded-full bg-[#271f45] px-3 py-1 text-xs text-[#c9bdf0] hover:bg-[#33285c] hover:text-white">Try again</button>
              </div>
            )}

            <section className="mt-14">
              <h2 className="font-display text-xl font-semibold text-white md:text-2xl">
                An online photo background remover with no compromises
              </h2>
              <div className="mt-4 grid gap-3 sm:grid-cols-2">
                <div className="card-sheen rounded-2xl border border-[#8b5cf6]/15 bg-[#1d1735]/50 p-4">
                  <div className="flex items-center gap-2 text-sm font-medium text-white"><Zap size={15} className="text-[#a855f7]" />Instant background removal</div>
